pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.firstdark.dev/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}


// Use matching sibling sources when this mod checkout is opened directly.
['TheOneProbe', 'McJtyLib', 'RFToolsBase'].each { mod ->
    def checkout = file("../${mod}_fabric")
    if (new File(checkout, 'build.gradle').isFile()) {
        include mod
        project(":${mod}").projectDir = checkout
    }
}

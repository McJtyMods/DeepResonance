buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def sharedTools = [
        providers.gradleProperty('gradletools_path').map { file(it) }.orNull,
        rootProject.file('gradletools.gradle'),
        file('../Multi_neo/gradletools.gradle'),
        file('../gradletools.gradle'),
        file('gradletools.gradle')
].find { it != null && it.isFile() }
apply from: sharedTools ?: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.2_neo/gradletools.gradle'

group = 'com.github.mcjty'
base.archivesName = 'deepresonance'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    top()
    mcjtylib()
    rftoolsbase()
}

modpublisher(['the-one-probe'], ['mcjtylib', 'rftools-base'], ['the-one-probe'], ['mcjtylib', 'rftools-base'], [])


if (providers.gradleProperty('deepResonanceTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gameTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    extensions.getByName('runs').named('gameTestServer') {
        arguments.addAll '--test', 'deepresonance:*'
    }
}

tasks.named('jar') {
    exclude 'mcjty/deepresonance/ResonanceTest*.class', 'data/deepresonance/structure/station.nbt'
}
